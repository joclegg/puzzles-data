name: Crossword

# Clues the crossword word list with Claude in parallel shards, then fills
# grids from the clued words and opens a pull request with the results.
# Re-running only clues words that have neither a clue nor a rejection yet.

on:
  workflow_dispatch:
    inputs:
      count:
        description: Grids to add per size
        default: "3000"
      shards:
        description: Parallel clue jobs
        default: "40"
      model:
        description: Claude model for the clues
        default: claude-opus-5-5
      effort:
        description: Effort for the clues (low, medium, high)
        default: medium
      skip_clues:
        description: Only generate grids from the clues already here
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        run: |
          python3 -c "import json; print('shards=' + json.dumps(list(range(int('${{ inputs.shards }}')))))" >> "$GITHUB_OUTPUT"

  clues:
    needs: plan
    if: ${{ !inputs.skip_clues }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/clues.py ${{ matrix.shard }} ${{ inputs.shards }} out/clues-${{ matrix.shard }}.txt --model "${{ inputs.model }}" --effort "${{ inputs.effort }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clues-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  grids:
    needs: clues
    # Runs even if some clue shards failed: their words wait for the next run.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: clues-*
          path: out
          merge-multiple: true
      - name: Merge the clues
        run: python3 scripts/merge_clues.py out
      - name: Generate the grids
        run: |
          for size in 11 13 15; do
            python3 scripts/crossword.py $size ${{ inputs.count }} --seed ${{ github.run_id }}$size
          done
      - run: python3 scripts/check_duplicates.py
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=crossword/${{ github.run_id }}
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crossword sources/crossword
          git commit -m "Add crossword clues and grids"
          git push origin "$branch"
          summary=$(python3 -c "
          from pathlib import Path
          for p in ['crossword/clues.txt', 'sources/crossword/rejected.txt', 'crossword/small.txt', 'crossword/medium.txt', 'crossword/large.txt']:
              f = Path(p)
              print(f'- \`{p}\`: {len(f.read_text().splitlines()) if f.exists() else 0} lines')
          ")
          gh pr create --base main --head "$branch" \
            --title "Add crossword clues and grids" \
            --body "Generated by the Crossword workflow, run ${{ github.run_id }}.

          $summary" \
            || echo "::warning::Pushed $branch but couldn't open a pull request. Allow GitHub Actions to create pull requests in the repository's Actions settings, or open one from the branch."
