name: Crossword

# Generates crossword grids in parallel shards, appends them to the banks and
# opens a pull request. Clues are written separately, into crossword/clues.txt.

on:
  workflow_dispatch:
    inputs:
      count:
        description: Grids to add per size
        default: "3000"
      shards:
        description: Parallel jobs per size
        default: "10"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: python3 -c "import json, os; print('shards=' + json.dumps(list(range(int(os.environ['SHARDS'])))))" >> "$GITHUB_OUTPUT"

  generate:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        size: [11, 13, 15]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate this shard's share
        env:
          COUNT: ${{ inputs.count }}
          SHARDS: ${{ inputs.shards }}
        run: |
          share=$(( (COUNT + SHARDS - 1) / SHARDS ))
          python3 scripts/crossword.py ${{ matrix.size }} $share \
            --seed ${{ github.run_id }}${{ matrix.size }}${{ matrix.shard }} \
            --out out/${{ matrix.size }}-${{ matrix.shard }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: grids-${{ matrix.size }}-${{ matrix.shard }}
          path: out/

  merge:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: grids-*
          path: out
          merge-multiple: true
      - name: Append new grids to the banks
        env:
          COUNT: ${{ inputs.count }}
        run: |
          python3 - <<'EOF'
          import os
          from pathlib import Path
          names = {11: "small", 13: "medium", 15: "large"}
          count = int(os.environ["COUNT"])
          for size, name in names.items():
              bank = Path("crossword") / f"{name}.txt"
              seen = set(bank.read_text().splitlines()) if bank.exists() else set()
              new = []
              for shard in sorted(Path("out").glob(f"{size}-*.txt"),
                                  key=lambda p: int(p.stem.split("-")[1])):
                  for line in shard.read_text().splitlines():
                      if line and line not in seen and len(new) < count:
                          seen.add(line)
                          new.append(line)
              with bank.open("a") as f:
                  f.writelines(line + "\n" for line in new)
              print(f"{bank}: added {len(new)}")
          EOF
      - run: python3 scripts/check_duplicates.py
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=crossword/${{ github.run_id }}
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add crossword
          git commit -m "Add crossword grids"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Add crossword grids" \
            --body "Generated by the Crossword workflow, run ${{ github.run_id }}. Clues still need writing for any new answers before this merges." \
            || echo "::warning::Pushed $branch but couldn't open a pull request. Allow GitHub Actions to create pull requests in the repository's Actions settings, or open one from the branch."
